<section class="section-form" id="formulario">
    <h2>📬 La Receta Perfecta en tu Email</h2>
    <p>Rellena este formulario. Cumple con la Ley de Fitts: áreas de clic amplias (44px) para dedos en móviles.</p>

    <form class="form" action="#" novalidate>
        <div class="form__group">
            <label for="nombre" class="form__label">Nombre</label>
            <input type="text" id="nombre" class="form__input" placeholder="Tu nombre chef" required>
        </div>

        <div class="form__group">
            <label for="email" class="form__label">Email</label>
            <input type="email" id="email" class="form__input" placeholder="correo@delicioso.com" required>
        </div>

        <div class="form__group">
            <label for="preferencia" class="form__label">Preferencia culinaria</label>
            <select id="preferencia" class="form__select" required>
                <option value="">Selecciona tu estilo...</option>
                <option value="vegan">Vegana</option>
                <option value="meat">Carnívora</option>
                <option value="dessert">Repostería</option>
            </select>
        </div>

        <div class="form__group form__group--checkbox">
            <input type="checkbox" id="acepto" class="form__checkbox" required>
            <label for="acepto" class="form__label">Acepto recibir recetas deliciosas semanalmente</label>
        </div>

        <button type="submit" class="form__submit">Suscribirme</button>
    </form>
</section>
